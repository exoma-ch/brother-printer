[project]
name = "brother_printer_text"
version = "0.1.0"
description = "Text-to-label rendering and CLI for Brother PT-E920BT"
requires-python = ">=3.12"
dependencies = [
    "brother_printer",
    "click>=8.1",
    "pillow>=10.1",
]

[project.scripts]
brother-label-text = "brother_printer_text.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brother_printer_text"]

[tool.uv.sources]
brother_printer = { workspace = true }
