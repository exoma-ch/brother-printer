[project]
name = "brother_printer"
version = "0.1.0"
description = "Open-source CLI and library for Brother PT-E920BT label printing"
requires-python = ">=3.12"
dependencies = [
    "pyusb>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brother_printer"]

[dependency-groups]
dev = [
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "rich>=13.0.0",
]
