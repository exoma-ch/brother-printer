[project]
name = "brother-ptouch-label"
dynamic = ["version"]
description = "Text-to-label rendering and CLI for Brother PT-E920BT"
requires-python = ">=3.12"
dependencies = [
    "brother-ptouch-driver",
    "click>=8.1",
    "pillow>=10.1",
]

[project.scripts]
brother-ptouch-label = "brother_ptouch_label.cli.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Package lives in a subdirectory of the repo; point setuptools-scm at the git root.
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/brother_ptouch_label"]

[tool.uv.sources]
brother-ptouch-driver = { workspace = true }
