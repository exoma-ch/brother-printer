[project]
name = "brother_printer"
version = "0.1.0"
description = "Open-source CLI and library for Brother PT-E920BT label printing"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pillow>=10",
    "pyusb>=1.2",
]

[project.scripts]
brother-printer = "brother_printer.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brother_printer"]

[tool.pytest.ini_options]
markers = [
    "hardware: requires a physically connected PT-E920BT (opt-in via BROTHER_PRINTER_HARDWARE=1)",
]

[dependency-groups]
dev = [
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "rich>=13.0.0",
]
