[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = [
    "packages/brother_ptouch_driver/tests",
    "packages/brother_ptouch_label/tests",
    "packaging/tests",
]
markers = [
    "hardware: requires a physically connected PT-E920BT (opt-in via BROTHER_PTOUCH_DRIVER_HARDWARE=1)",
]

[tool.coverage.run]
source = [
    "packages/brother_ptouch_driver/src",
    "packages/brother_ptouch_label/src",
]

[dependency-groups]
dev = [
    "hatchling==1.29.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "rich==15.0.0",
]
