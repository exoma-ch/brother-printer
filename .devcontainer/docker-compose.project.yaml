# docker-compose.project.yaml
#
# Project/team-specific compose overrides.
#
# Use this file for configuration that should be SHARED with your team:
#   - Project-specific sidecars (databases, caches, etc.)
#   - Shared environment variables
#   - Additional volume mounts needed by everyone
#
# This file is:
#   - Git tracked (commit your changes)
#   - Preserved during devcontainer upgrades (init-workspace.sh --force)
#
# For personal/local overrides, use docker-compose.local.yaml instead.
#
# Example:
#
#   services:
#     devcontainer:
#       environment:
#         - PROJECT_API_URL=https://api.example.com
#
#     postgres:
#       image: postgres:16-alpine
#       environment:
#         POSTGRES_PASSWORD: devpassword
#       volumes:
#         - postgres-data:/var/lib/postgresql/data
#
#   volumes:
#     postgres-data:

services:
  devcontainer:
    # USB passthrough for PT-E920BT hardware verification (issue #4).
    # Bind-mounts the whole /dev/bus/usb tree so replugged devices appear
    # without recreating the container. Rootless Podman remaps device nodes to
    # nobody:nogroup — use packaging/udev/99-brother-ptouch_devcontainer.rules
    # on dev hosts (see docs/install/linux-usb.md). Do not set device_cgroup_rules
    # or group_add keep-groups here: rootless Podman rejects cgroup device rules
    # and does not implement Docker's keep-groups. Rootful Docker users may add
    # device_cgroup_rules: ["c 189:* rwm"] in docker-compose.local.yaml.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
