[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = [
    "packages/brother_printer/tests",
    "packages/brother_printer_text/tests",
]
markers = [
    "hardware: requires a physically connected PT-E920BT (opt-in via BROTHER_PRINTER_HARDWARE=1)",
]

[dependency-groups]
dev = [
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "qrcode>=8.0",
    "rich>=13.0.0",
]
